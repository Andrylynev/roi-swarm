name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --extra dev --frozen --python '${{ matrix.python }}'
      - name: Tests
        run: uv run --no-sync pytest -q
      - name: Real Linux privilege-boundary regression tests
        if: matrix.python == '3.11'
        run: |
          sudo "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest -q tests/test_installer.py \
            -k 'real_root_wrapper or real_private_parent'
      - name: Ruff
        run: uv run --no-sync ruff check .
      - name: Check the local provider fixture
        run: uv run --no-sync python scripts/ci_installer_smoke.py --self-test

  installer:
    name: Root systemd installer / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Shell syntax and ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          bash -n install.sh
          shellcheck --shell=bash install.sh
      - name: Expose this exact checkout as the local main branch
        run: |
          git checkout -B main
          # sudo uses root's Git configuration, not checkout's runner-owned one.
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE/.git"
      - name: Secure shared tool directory on this disposable runner
        # Hosted runners allow group writes here; a client root install refuses that.
        run: sudo chmod 755 /usr/local /usr/local/bin
      - name: Install, verify, update, reconfigure and uninstall
        # Only a loopback deterministic OpenAI fixture is used. No paid API calls.
        run: |
          sudo env "PATH=$PATH" "GITHUB_ACTIONS=$GITHUB_ACTIONS" \
            "$(command -v python3)" scripts/ci_installer_smoke.py \
            --repo "$GITHUB_WORKSPACE"
